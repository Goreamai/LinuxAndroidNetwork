name: host-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test
      - name: Stage root filesystem
        run: make stage
      - name: Check shell syntax
        run: |
          for file in services/*.sh packaging/init.d/nexus scripts/*.sh tests/*.sh; do
            sh -n "$file"
          done
